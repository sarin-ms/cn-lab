 ['server','client'].forEach(k=>{const bt=el('button',null,k==='server'?'Server code':'Client code');bt.setAttribute('aria-pressed',String(which===k));bt.onclick=()=>{which=k;render()};bar.append(bt)});

 const nb=el('button',null,showNotes?'Hide line notes':'Show line notes');nb.setAttribute('aria-pressed',String(showNotes));nb.onclick=()=>{showNotes=!showNotes;render()};bar.append(nb);
 const cp=el('button',null,'Copy code');cp.onclick=async()=>{try{await navigator.clipboard.writeText(t[which].source);cp.textContent='Copied'}catch(e){cp.textContent='Select the code to copy'}setTimeout(()=>cp.textContent='Copy code',1600)};bar.append(cp);
 m.append(bar);
 m.append(el('p','note',t[which].file));
 const box=el('div','code'+(showNotes?'':' hide'));
 t[which].lines.forEach((l,i)=>{const r=el('div','ln');r.append(el('div','n',String(i+1)),el('div','c',l.code),el('div','e',l.note));box.append(r)});
 m.append(box);
 window.scrollTo(0,0);
}
function home(m){
 m.append(el('h2',null,'Socket programming: the yellow questions'));
 const i=el('div','intro');
 [['The PDF has no printed question numbers, so Q03, Q07 and so on count the questions from the top of page 1 through page 2.'],
  ['Every program here was compiled with gcc and run as a real client and server pair, using the example inputs shown on each page.'],
  ['Each page explains the idea, shows the key line, gives worked examples, then walks through the server and client code with a note beside every line.'],
  ['Programs are for Linux or WSL. All use port 12345, so run one question at a time and start the server before the client.']
 ].forEach(p=>i.append(el('p',null,p[0])));
 m.append(i);
 TASKS.forEach(t=>{const a=el('a');a.href='#'+t.id;a.style.cssText='display:block;text-decoration:none;color:inherit;margin-bottom:10px';
  const d=el('div','intro');d.style.margin='0';
  const tg=el('span','tag '+t.protocol.toLowerCase(),t.protocol);
  const h=el('strong',null,'  Q'+String(t.position).padStart(2,'0')+': '+t.title);
  d.append(tg,h,el('p','note',t.prompt));a.append(d);m.append(a)});
}
addEventListener('hashchange',render);render();
</script>
</body>
</html>
